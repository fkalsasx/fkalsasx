<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456" role="img" aria-labelledby="title desc">
<title id="title">Fkalsasx — independent developer</title>
<desc id="desc">An animated orbital sculpture beside the words: Thoughtful software. Distinctive experiences. AI tools, Windows engineering, and games. Based in Türkiye.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171d21"/><stop offset=".55" stop-color="#0d1217"/><stop offset="1" stop-color="#121c1c"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#92e6cb" stop-opacity=".14"/><stop offset="1" stop-color="#92e6cb" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4f8e6"/><stop offset=".22" stop-color="#3d7269"/><stop offset=".46" stop-color="#d4f8ee"/><stop offset=".7" stop-color="#25483f"/><stop offset="1" stop-color="#80c6b0"/></linearGradient>
 <linearGradient id="line"><stop stop-color="#a7f3d0" stop-opacity="0"/><stop offset=".5" stop-color="#a7f3d0"/><stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#b2dfd3" stroke-opacity=".035"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
 text{font-family:Arial,Helvetica,sans-serif}
 .orbit{transform-origin:958px 225px;animation:orbit 32s linear infinite}
 .reverse{animation-direction:reverse;animation-duration:44s}
 .float{animation:float 8s ease-in-out infinite}
 .pulse{animation:pulse 3.8s ease-in-out infinite}
 .sweep{animation:sweep 8s ease-in-out infinite}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes float{50%{transform:translateY(-9px)}}
 @keyframes pulse{50%{opacity:.35}}
 @keyframes sweep{0%,15%{transform:translateX(-290px);opacity:0}30%{opacity:.7}70%{opacity:.7}85%,100%{transform:translateX(1200px);opacity:0}}
 @media(prefers-reduced-motion:reduce){.orbit,.float,.pulse,.sweep{animation:none}.sweep{opacity:0}}
</style>
<rect x="1" y="1" width="1198" height="454" rx="22" fill="url(#bg)" stroke="#2b363b"/>
<rect x="1" y="1" width="1198" height="454" rx="22" fill="url(#grid)"/>
<circle cx="962" cy="224" r="235" fill="url(#halo)"/>
<path d="M48 56h22M48 56v22M1152 378v22h-22" stroke="#7eaa9c" stroke-opacity=".55" fill="none"/>
<circle cx="85" cy="64" r="4" fill="#a7f3d0" class="pulse"/>
<text x="100" y="69" fill="#aec2ba" font-size="13" letter-spacing="3">INDEPENDENT DEVELOPER</text>
<text x="64" y="166" fill="#f2f3eb" font-size="86" font-weight="700" letter-spacing="-5">FKALSASX<tspan fill="#a7f3d0">.</tspan></text>
<text x="68" y="222" fill="#ecefe8" font-size="29" letter-spacing="-.7">Thoughtful software.</text>
<text x="68" y="260" fill="#ecefe8" font-size="29" letter-spacing="-.7">Distinctive experiences.</text>
<text x="68" y="311" fill="#94a8a1" font-size="17">AI tools <tspan fill="#597369"> / </tspan> Windows engineering <tspan fill="#597369"> / </tspan> Games</text>
<path d="M68 347H635" stroke="#2d3c37"/>
<text x="68" y="380" fill="#c0d0c8" font-size="12" letter-spacing="2.3">BASED IN TÜRKİYE</text>
<text x="475" y="380" fill="#6f8b80" font-size="12" letter-spacing="2.3">IDEA → RELEASE</text>
<g class="float">
 <circle cx="958" cy="225" r="113" stroke="#6ea895" stroke-opacity=".13" fill="#101c1c" fill-opacity=".35"/>
 <g fill="none" stroke="url(#metal)" stroke-width="1.3">
  <ellipse cx="958" cy="225" rx="147" ry="52" transform="rotate(-33 958 225)"/>
  <ellipse cx="958" cy="225" rx="147" ry="52" transform="rotate(33 958 225)"/>
  <ellipse cx="958" cy="225" rx="147" ry="52" transform="rotate(90 958 225)"/>
  <circle cx="958" cy="225" r="105" stroke-opacity=".5"/>
  <ellipse cx="958" cy="225" rx="105" ry="26" stroke-opacity=".25"/>
  <ellipse cx="958" cy="225" rx="105" ry="70" stroke-opacity=".25"/>
 </g>
 <circle cx="958" cy="225" r="31" fill="url(#halo)" stroke="#81bca5" stroke-opacity=".18"/>
 <path d="m944 225 10 10 20-22" fill="none" stroke="#b8f5df" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
 <g class="orbit"><circle cx="1063" cy="225" r="8" fill="#a7f3d0" opacity=".45" filter="url(#glow)"/><circle cx="1063" cy="225" r="3.5" fill="#d8ffef"/></g>
 <g class="orbit reverse"><circle cx="958" cy="78" r="3" fill="#a7f3d0"/><circle cx="958" cy="78" r="8" fill="none" stroke="#a7f3d0" stroke-opacity=".25"/></g>
</g>
<text x="958" y="414" text-anchor="middle" fill="#789489" font-size="11" letter-spacing="3">CRAFT / CODE / CURIOSITY</text>
<path d="M32 434H1168" stroke="#2b3e36"/>
<path d="M0 434H260" stroke="url(#line)" class="sweep"/>
</svg>