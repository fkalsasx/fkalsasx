<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="258" viewBox="0 0 1200 258" role="img" aria-labelledby="title desc">
<title id="title">Traceglass — see the whole request</title><desc id="desc">A local HAR workbench with waterfalls, comparisons, sanitized exports, and a zero-dependency CLI. Animated request waterfall.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141c20"/><stop offset="1" stop-color="#101619"/></linearGradient><linearGradient id="beam"><stop stop-color="#a7f3d0" stop-opacity="0"/><stop offset="1" stop-color="#a7f3d0" stop-opacity=".4"/></linearGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.scan{animation:scan 7s ease-in-out infinite}.bar{animation:bar 5s ease-in-out infinite}.b2{animation-delay:-1s}.b3{animation-delay:-2s}@keyframes scan{0%,100%{transform:translateX(0);opacity:0}15%,85%{opacity:.6}90%{transform:translateX(290px)}}@keyframes bar{0%,100%{opacity:.45}45%,65%{opacity:1}}@media(prefers-reduced-motion:reduce){.scan,.bar{animation:none}.scan{opacity:0}}</style>
