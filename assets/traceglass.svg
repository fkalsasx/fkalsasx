<text x="38" y="132" fill="#b8d0c5" font-size="22">See the whole request.</text>
<text x="38" y="170" fill="#94a9a1" font-size="18">HAR analysis. Clear waterfalls. Before / after comparisons.</text>
<text x="38" y="217" fill="#b7d9ca" font-size="12" letter-spacing="1.6">JAVASCRIPT <tspan fill="#4f7464"> / </tspan> LOCAL-FIRST <tspan fill="#4f7464"> / </tspan> ZERO DEPENDENCIES</text>
